# CI/CD for hele monorepoet:
#   1. test  – bygger løsningen og kører alle NUnit-tests for alle 5 services
#   2. build – bygger et Docker-image pr. microservice og pusher det til
#              GitHub Container Registry (ghcr.io) ved push til main.
# build kører KUN hvis alle tests er grønne.
# Pull requests bygges og testes kun (ingen push), så man ser om alt virker.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Services bruger CarRental.Shared som NuGet-pakke fra local-nuget-feed/,
      # så den skal bygges først – samme rækkefølge som lokalt (se README).
      - name: Build CarRental.Shared (local NuGet feed)
        run: dotnet build CarRental.Shared/CarRental.Shared.csproj -c Release

      - name: Restore
        run: dotnet restore CarRentalSystem.sln

      - name: Build
        run: dotnet build CarRentalSystem.sln -c Release --no-restore

      # Kører alle 5 testprojekter. Car-testene starter selv en PostgreSQL
      # i Docker (Testcontainers) – Docker er installeret på ubuntu-latest.
      - name: Test
        run: >
          dotnet test CarRentalSystem.sln -c Release --no-build
          --logger "trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults